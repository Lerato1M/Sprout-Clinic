<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sprout Clinic 🌱</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />

  <!-- Embedded CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #d0f0c0; /* Mint green */
      color: #004d00;
      margin: 0;
      padding: 0;
      border-style: solid;
      border-color: #004d00;
      border-width: 2px 10px 2px 2px; /* Top, Right (thick), Bottom, Left (thin) */
      background-image: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><text x="0" y="15" font-size="18" fill="white">🌿</text></svg>');
      background-repeat: repeat-y;
      background-position: right;
      background-size: 20px 40px;
    }

    header {
      background-color: #b3e6b3;
      padding: 1rem;
      text-align: center;
      border-bottom: 4px solid #004d00;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #004d00;
      font-size: 2.5rem;
      font-weight: bold;
      margin: 0;
    }

    h2 {
      color: #004d00;
    }

    nav {
      margin-top: 1rem;
    }

    nav button {
      background-color: #004d00;
      color: white;
      border: none;
      margin: 0 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    main {
      padding: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 400px;
      margin-top: 1rem;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      padding: 0.5rem;
      border: 1px solid #99cc99;
      border-radius: 4px;
      font-size: 1rem;
    }

    button[type="submit"] {
      background-color: #009900;
      color: white;
      padding: 0.6rem;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    button[type="submit"]:hover {
      background-color: #006600;
    }

    .disease-card {
      background-color: white;
      border-left: 5px solid #00cc44;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
    }
  </style>

</head>

<body>

  <header>
    <h1>🌱 Sprout Clinic</h1>
    <nav>
      <button onclick="showSection('Upload')">Upload Crop Issue</button>
      <button onclick="showSection('Gallery')">Disease Gallery</button>
      <button onclick="showSection('Submit')">Submit Problem</button>
    </nav>

  </header>

  <main>
    <!-- Upload Section -->
    <section id="upload" class="section">
      <h2>Upload Crop Issue</h2>
      <form id="uploadForm">
        <input type="file" accept="image/*" />
        <input type="text" placeholder="Crop Name" />
        <input type="text" placeholder="Symptoms" />
        <textarea placeholder="Additional Notes (optional)"></textarea>
        <input type="text" placeholder="Location (optional)" />
        <button type="submit">Submit</button>
      </form>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="section" style="display:none;">
      <h2>Disease Gallery</h2>
      <div class="disease-card">
        <h3>Powdery Mildew</h3>
        <p><strong>Crops:</strong> Tomato</p>
        <p><strong>Symptoms:</strong> White patches on leaves</p>
        <p><strong>Treatment:</strong> Fungicide spray</p>
      </div>
      <div class="disease-card">
        <h3>Rust</h3>
        <p><strong>Crops:</strong> Wheat</p>
        <p><strong>Symptoms:</strong> Orange-brown pustulates</p>
        <p><strong>Treatment:</strong> Resistant Variants</p>
      </div>
    </section>

    <!-- Submit Problem Section -->
    <section id="submit" class="section" style="display:none;">
      <h2>Submit a Problem</h2>
      <form id="problemForm">
        <input type="text" placeholder="Crop Name" />
        <textarea placeholder="Problem Description"></textarea>
        <input type="file" accept="image/*" />
        <input type="text" placeholder="Location (optional)" />
        <input type="email" placeholder="Email (optional)" />
        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <script>
    function showSection(id) {
      const sections = document.querySelectorAll('.section');
      sections.forEach(section => section.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }
  </script>
</body>
</html>
